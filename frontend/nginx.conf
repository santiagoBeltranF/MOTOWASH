server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El bundle de Vite comprime bien; ahorra bastante en la primera carga.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 10m;

    # -------------------------------------------------------------------------
    # API: proxy hacia el backend por la red interna de Compose.
    # Sirviendo el estatico y el API desde el mismo origen, el navegador nunca
    # dispara una peticion cross-origin, asi que CORS deja de ser un problema.
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Sin esta cabecera el backend ve la IP de nginx en todas las peticiones
        # y el limite de 5 intentos de login se aplica globalmente a todos los
        # usuarios juntos. Va emparejada con TRUST_PROXY_HOPS=1 en el backend.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout   30s;
    }

    # -------------------------------------------------------------------------
    # Health check. Ojo: en server.js NO cuelga de /api, esta en la raiz.
    # -------------------------------------------------------------------------
    location = /health {
        proxy_pass http://backend:3000/health;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }

    # Los assets de Vite llevan hash en el nombre, asi que se pueden cachear
    # de forma agresiva sin riesgo de servir una version vieja.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca se cachea: es lo que apunta a los assets con hash.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # -------------------------------------------------------------------------
    # Fallback de React Router. Cualquier ruta que no exista como archivo
    # devuelve index.html para que el router la resuelva del lado cliente.
    # Sin esto, un F5 en /admin/citas responde 404 porque nginx busca un
    # archivo con ese nombre en disco y no lo encuentra.
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
