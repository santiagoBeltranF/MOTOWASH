server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker. Hace falta para que las directivas proxy_pass de
    # abajo puedan re-resolver el nombre del backend en caliente.
    #
    # Sin esto, nginx resuelve `backend` UNA sola vez al arrancar y se queda con
    # esa IP para siempre. Como Docker asigna una IP nueva a cada contenedor
    # recreado, cualquier redespliegue del backend (docker compose up -d
    # backend, una imagen nueva...) dejaba todo /api respondiendo 502 hasta que
    # alguien reiniciaba nginx a mano.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # El bundle de Vite comprime bien; ahorra bastante en la primera carga.
    #
    # OJO: `application/json` NO esta en la lista, y es deliberado. Al incluirlo,
    # nginx comprimia tambien las respuestas del API que pasan de 1 KB — en la
    # practica solo /api/services (1171 B)— sirviendolas gzip + chunked. En
    # Firefox y WebKit eso producia, de forma intermitente, un cuerpo que axios
    # no lograba parsear: se quedaba como texto crudo, `r.data.services` salia
    # undefined y la pantalla de Agendar reventaba con
    # «can't access property "map"». En Chromium no se reproducia nunca.
    #
    # El API va por la red local del contenedor y sus respuestas son de un par
    # de kilobytes: comprimirlas no aporta nada y anadia ese riesgo.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript image/svg+xml;
    # Ademas, no comprimir nada que venga de un upstream proxeado.
    gzip_proxied off;

    client_max_body_size 10m;

    # -------------------------------------------------------------------------
    # API: proxy hacia el backend por la red interna de Compose.
    # Sirviendo el estatico y el API desde el mismo origen, el navegador nunca
    # dispara una peticion cross-origin, asi que CORS deja de ser un problema.
    # -------------------------------------------------------------------------
    location /api/ {
        # El destino va en una variable a proposito: es lo que obliga a nginx a
        # resolver el nombre en cada peticion en vez de cachearlo al arrancar.
        # Al usar variable, nginx ya no reescribe la ruta, de ahi $request_uri,
        # que reenvia el URI original completo con su query string.
        set $destino_api backend:3000;
        proxy_pass http://$destino_api$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Sin esta cabecera el backend ve la IP de nginx en todas las peticiones
        # y el limite de 5 intentos de login se aplica globalmente a todos los
        # usuarios juntos. Va emparejada con TRUST_PROXY_HOPS=1 en el backend.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout   30s;
    }

    # -------------------------------------------------------------------------
    # Health check. Ojo: en server.js NO cuelga de /api, esta en la raiz.
    # -------------------------------------------------------------------------
    location = /health {
        set $destino_health backend:3000;
        proxy_pass http://$destino_health/health;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }

    # Los assets de Vite llevan hash en el nombre, asi que se pueden cachear
    # de forma agresiva sin riesgo de servir una version vieja.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca se cachea: es lo que apunta a los assets con hash.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # -------------------------------------------------------------------------
    # Fallback de React Router. Cualquier ruta que no exista como archivo
    # devuelve index.html para que el router la resuelva del lado cliente.
    # Sin esto, un F5 en /admin/citas responde 404 porque nginx busca un
    # archivo con ese nombre en disco y no lo encuentra.
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
